<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="kPad">
  <meta name="theme-color" content="#0e0f13">
  <title>kPad</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header id="status">
    <span id="dot" class="dot"></span>
    <span id="statusText">connecting…</span>
    <span id="rtt" class="rtt"></span>
    <button id="presentToggle" class="barBtn" aria-label="presenter">📽️</button>
    <button id="mediaToggle" class="barBtn" aria-label="media keys">🎵</button>
    <button id="clipToggle" class="barBtn" aria-label="clipboard">📋</button>
    <button id="kbdToggle" class="barBtn" aria-label="keyboard">⌨</button>
  </header>

  <main id="pad" aria-label="trackpad surface"></main>

  <!-- Presenter: drive any slideshow (Keynote / PowerPoint / PDF / Slides) -->
  <section id="present" class="panel hidden">
    <div class="presentBig">
      <button data-pkey="prev">‹<span>Prev</span></button>
      <button data-pkey="next">›<span>Next</span></button>
    </div>
    <div class="presentRow">
      <button data-pkey="black">⬛ Black</button>
      <button data-pkey="end">✕ End</button>
    </div>
    <div id="notes" class="notes">Speaker notes (Keynote) show here while you present.</div>
    <p class="kbdHint">Prev/Next/Black/End work in any slideshow. Notes read from Keynote (asks permission once).</p>
    <button id="presentDone" class="kbdDone">Done</button>
  </section>

  <!-- Media / volume / brightness keys -->
  <section id="media" class="panel hidden">
    <div class="mediaRow">
      <button data-media="MEDIA_PREV">⏮</button>
      <button data-media="MEDIA_PLAY_PAUSE">⏯</button>
      <button data-media="MEDIA_NEXT">⏭</button>
    </div>
    <div class="mediaRow">
      <button data-media="MEDIA_VOL_DOWN">🔉</button>
      <button data-media="MEDIA_VOL_UP">🔊</button>
      <button data-media="MEDIA_MUTE">🔇</button>
    </div>
    <div class="mediaRow">
      <button data-media="MEDIA_BRIGHT_DOWN">🔅</button>
      <button data-media="MEDIA_BRIGHT_UP">🔆</button>
    </div>
    <button id="mediaDone" class="kbdDone">Done</button>
  </section>

  <!-- Clipboard sync (both directions) -->
  <section id="clip" class="panel hidden">
    <div class="clipSec">
      <label>Mac clipboard</label>
      <textarea id="clipFromMac" rows="3" readonly
                placeholder="(the Mac's clipboard appears here)"></textarea>
      <button id="clipCopy">Copy to phone</button>
    </div>
    <div class="clipSec">
      <label>Send to Mac</label>
      <textarea id="clipToMac" rows="3"
                placeholder="Paste or type here, then Send — sets the Mac's clipboard"></textarea>
      <button id="clipSend">Send to Mac</button>
    </div>
    <button id="clipDone" class="kbdDone">Done</button>
  </section>

  <!-- Keyboard panel: text + native dictation + special keys + sticky modifiers -->
  <section id="kbd" class="panel hidden">
    <div class="kbdBar">
      <textarea id="kbdInput" rows="2" autocapitalize="off" autocomplete="off"
                autocorrect="off" spellcheck="false" inputmode="text"
                placeholder="Type here, or tap 🎤 on your keyboard to dictate — goes to your Mac"></textarea>
      <button id="kbdDone" class="kbdDone">Done</button>
    </div>
    <div class="kbdKeys">
      <button data-key="Escape">esc</button>
      <button data-key="Tab">⇥ tab</button>
      <button data-key="Backspace">⌫</button>
      <button data-key="Return">⏎ return</button>
      <button data-key="ArrowLeft">←</button>
      <button data-key="ArrowDown">↓</button>
      <button data-key="ArrowUp">↑</button>
      <button data-key="ArrowRight">→</button>
    </div>
    <div class="kbdMods">
      <button data-mod="CONTROL">⌃ ctrl</button>
      <button data-mod="OPTION">⌥ opt</button>
      <button data-mod="SHIFT">⇧ shift</button>
      <button data-mod="COMMAND">⌘ cmd</button>
      <span class="kbdHint">tap a modifier, then a key (⌘C, ⌘Tab…)</span>
    </div>
  </section>

  <!-- Pairing overlay: shown first-time or if the Mac no longer knows this phone -->
  <section id="pair" class="hidden">
    <div class="pairBox">
      <h1>Pair with your Mac</h1>
      <p id="pairMsg">Enter the 6-digit code shown on your Mac.</p>
      <input id="pairCode" inputmode="numeric" pattern="[0-9]*" maxlength="6"
             autocomplete="one-time-code" placeholder="000000">
      <button id="pairBtn">Connect</button>
      <p id="pairErr" class="pairErr"></p>
    </div>
  </section>

  <!-- Dev tuning panel: ?dev=1 or triple-tap the top-left corner -->
  <section id="dev" class="hidden">
    <div class="devRow"><label>accel k</label>
      <input id="k" type="range" min="0" max="0.4" step="0.005"><output id="kOut"></output></div>
    <div class="devRow"><label>cap</label>
      <input id="cap" type="range" min="0" max="8" step="0.1"><output id="capOut"></output></div>
    <div class="devRow"><label>deadzone</label>
      <input id="deadzone" type="range" min="0" max="3" step="0.1"><output id="deadzoneOut"></output></div>
    <div class="devRow"><label>scroll×</label>
      <input id="scrollMult" type="range" min="0.2" max="4" step="0.1"><output id="scrollMultOut"></output></div>
    <div class="devRow devInfo"><span id="devRtt">rtt —</span></div>
    <div class="devRow devBtns">
      <button id="copyCfg">copy config</button>
      <button id="closeDev">close</button>
    </div>
  </section>

  <!-- Generated from server/protocol.py by `make proto`; loaded first. -->
  <script src="protocol.js"></script>
  <script src="keymap.js"></script>
  <script src="app.js"></script>
  <script src="trackpad.js"></script>
  <script src="keyboard.js"></script>
  <script src="clipboard.js"></script>
  <script src="media.js"></script>
  <script src="present.js"></script>
</body>
</html>
