name: Release

# Build the .dmg on a macOS runner and publish a GitHub Release whenever a
# version tag is pushed. macOS runners are free for public repositories.
#
#   git tag -a v0.2.0 -m "v0.2.0" && git push origin v0.2.0
#
# The build is ad-hoc signed (no Apple Developer account needed). To ship a
# Developer ID-signed + notarized build instead, add repo secrets and pass them
# through to scripts/build.sh via env (CODESIGN_IDENTITY / NOTARY_PROFILE) — see
# the commented block below.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}     # allow manual runs from the Actions tab

permissions:
  contents: write           # needed to create the Release

jobs:
  build:
    runs-on: macos-latest   # Apple Silicon; matches the arm64 target
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Build .app + .dmg
        run: make dmg
        # env:
        #   CODESIGN_IDENTITY: ${{ secrets.CODESIGN_IDENTITY }}
        #   NOTARY_PROFILE: ${{ secrets.NOTARY_PROFILE }}

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/kPad.dmg
          generate_release_notes: true
          body: |
            **Install:** open `kPad.dmg`, drag **kPad** onto **Applications**,
            launch it, and grant Accessibility once (menu → Grant Accessibility).

            This build is ad-hoc signed (free & open-source, not notarized), so
            macOS blocks it on first launch with *"Apple could not verify…"*.
            To open it:
            - **System Settings → Privacy & Security →** scroll down **→ Open Anyway**, or
            - Terminal: `xattr -dr com.apple.quarantine "/Applications/kPad.app"`
